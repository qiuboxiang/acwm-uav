repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: research-validate
        name: Validate research metadata
        entry: researchctl validate
        language: system
        pass_filenames: false
