[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-research-template"
version = "0.1.0"
description = "Traceable code, experiment, paper, and release template for AI research"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "hydra-core>=1.3,<2",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
research = [
  "dvc[s3]>=3.55,<4",
  "huggingface-hub>=0.27,<2",
  "mlflow>=2.17,<4",
  "submitit>=1.5,<2",
  "torch>=2.5,<3",
]
dev = [
  "mypy>=1.13,<2",
  "pre-commit>=4,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
researchctl = "researchctl.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/research", "src/researchctl"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: exercises filesystem, git, or subprocess integration",
  "research: requires the optional PyTorch research stack",
  "network: requires live network access",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["research", "researchctl"]

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "mlflow", "mlflow.*", "submitit", "huggingface_hub"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["research", "researchctl"]

[tool.coverage.report]
show_missing = true
skip_covered = true
